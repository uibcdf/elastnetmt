name: Promote qualified exact Conda file
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full reviewed source and installed-gate candidate SHA
        required: true
        type: string
      version:
        description: Canonical version in the staged committed release plan
        required: true
        type: string
      sha256:
        description: Exact staged file digest tested by the installed gate
        required: true
        type: string
      installed_run_id:
        description: Existing successful full installed matrix run
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  promote:
    uses: uibcdf/molsyssuite/.github/workflows/promote-noarch-conda.yaml@42e4de425871c125ef058842075c39e50fc6ac64
    with:
      candidate_sha: ${{ inputs.candidate_sha }}
      version: ${{ inputs.version }}
      sha256: ${{ inputs.sha256 }}
      installed_run_id: ${{ inputs.installed_run_id }}
    secrets:
      ANACONDA_TOKEN: ${{ secrets.ANACONDA_UIBCDF_TOKEN }}
