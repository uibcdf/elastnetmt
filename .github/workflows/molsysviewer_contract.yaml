name: MolSysViewer add-on contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 9 * * MON"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: devtools/conda-envs/test_env_py313.yaml
          environment-name: test
          condarc: |
            channels:
              - uibcdf
              - conda-forge
              - ambermd
            channel_priority: strict
          create-args: python=3.13

      - name: Install controlled suite and current MolSysViewer
        shell: bash -l {0}
        run: |
          python -m pip install --no-deps -r devtools/requirements/controlled_suite_dependencies.txt
          python -m pip install --no-deps "git+https://github.com/uibcdf/molsysmt@3bcfaf4d50df6c84ebd14505790ed5221543e5de"
          python -m pip install --no-deps -e .
          python -m pip install --no-deps --upgrade "molsysviewer @ git+https://github.com/uibcdf/molsysviewer.git@main"

      - name: Verify the add-on contract
        shell: bash -l {0}
        run: python -m pytest tests/integration/test_molsysviewer_addon.py -q
