name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * MON"
    - cron: "19 2 * * *"
      timezone: "America/Mexico_City"
  workflow_dispatch:
    inputs:
      probe_backlog:
        description: Check skipped-commit debt without running the matrix
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  native-wheel-linux:
    name: Build ABI3 wheel on ${{ matrix.os }}
    if: inputs.probe_backlog != true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps: &native-wheel-steps
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Select the reviewed Rust toolchain
      run: |
        rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
        rustup default 1.98.1
        rustc --version
    - name: Check Rust contracts
      run: |
        cargo fmt --manifest-path rust/Cargo.toml --check
        cargo clippy --locked --manifest-path rust/Cargo.toml --no-default-features -- -D warnings
        cargo test --locked --manifest-path rust/Cargo.toml --no-default-features
    - name: Build source archive and wheel from its bytes
      run: |
        python -m pip install build
        python -m build --sdist --outdir native-sdist
        python -m pip wheel native-sdist/*.tar.gz --no-deps --wheel-dir native-wheelhouse
    - uses: actions/upload-artifact@v4
      with:
        name: native-wheel-${{ matrix.os }}
        path: native-wheelhouse/*.whl
        if-no-files-found: error

  native-wheel-macos:
    name: Build ABI3 wheel on ${{ matrix.os }}
    if: inputs.probe_backlog != true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    steps: *native-wheel-steps

  governance:
    name: Reporting governance
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check out the reviewed distribution SDK
      uses: actions/checkout@v4
      with:
        repository: uibcdf/molsyssuite
        ref: c866f0aa85f5fa0aec91973421eb23080daefdcc
        path: .molsyssuite
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: "3.14"
    - name: Check reporting records and generated indexes
      run: |
        python devtools/devguide_index.py --check
        python -m unittest discover -s tests -p test_reporting_protocol.py
    - name: Install CI-governance test tools
      run: python -m pip install "pytest>=8" "pytest-receptor==1.2.1" "PyYAML>=6" "Jinja2>=3,<4" "packaging>=24"
    - name: Test CI recovery and contributor routes
      run: python -m pytest --receptor=ci tests/test_ci_backlog.py devtools/tests/test_ci_routes.py devtools/tests/test_native_wheel.py devtools/tests/test_native_build.py
    - name: Review declared dependency routes
      run: python devtools/check_dependency_routes.py --declared-only
    - name: Test environment generation and helper contracts
      run: |
        python devtools/broadcast_requirements.py --check
        python -m unittest discover -s devtools/tests -p test_environment_tools.py
    - name: Test source dependency routes
      run: python -m unittest discover -s devtools/tests -p test_source_routes.py
    - name: Test distribution resources and publication contracts
      run: python -m unittest discover -s devtools/tests -p test_distribution_contract.py

  nightly-decision:
    name: Check skipped-commit backlog
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '19 2 * * *')
      || (github.event_name == 'workflow_dispatch' && inputs.probe_backlog == true)
    runs-on: ubuntu-latest
    outputs:
      run_full: ${{ steps.decide.outputs.run_full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether to run the full matrix
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python devtools/ci_backlog.py

  test-linux:
    needs: [nightly-decision, native-wheel-linux]
    if: >-
      always() && inputs.probe_backlog != true
      && needs.native-wheel-linux.result == 'success'
      && (github.event_name != 'schedule' || github.event.schedule != '19 2 * * *'
      || needs.nightly-decision.result != 'success'
      || needs.nightly-decision.outputs.run_full == 'true')
    name: Test on ${{ matrix.cfg.os }}, Python ${{ matrix.cfg.python-version }}
    runs-on: ${{ matrix.cfg.os }}
    strategy:
      fail-fast: false  # do not cancel all in-progress jobs if any job variation fails
      matrix:
        cfg:
          - { os: ubuntu-latest, python-version: "3.13", environment-file: "devtools/conda-envs/test_env_py313.yaml"}
          - { os: ubuntu-latest, python-version: "3.14", environment-file: "devtools/conda-envs/test_env_py314.yaml"}
          - { os: ubuntu-latest, python-version: "3.11", environment-file: "devtools/conda-envs/test_env.yaml"}
          - { os: ubuntu-latest, python-version: "3.12", environment-file: "devtools/conda-envs/test_env.yaml"}

    steps: &installed-science-steps
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Additional info about the build
      shell: bash
      run: |
        uname -a

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.cfg.python-version }}

    - name: Setup conda env
      uses: mamba-org/setup-micromamba@v1
      with:
        environment-file: ${{ matrix.cfg.environment-file }}
        environment-name: test
        condarc: |
          channels:
            - uibcdf
            - conda-forge
            - ambermd
          channel_priority: strict

        create-args: >-
          python=${{ matrix.cfg.python-version }}

    - name: Select the reviewed Rust toolchain for source providers
      run: |
        rustup toolchain install 1.98.1 --profile minimal
        rustup default 1.98.1

    - name: Install pinned suite dependencies
      shell: bash -l {0}
      run: |
        set -euo pipefail
        if [[ "${{ matrix.cfg.python-version }}" == "3.14" ]]; then
          python -m pip install --no-deps --force-reinstall -r devtools/requirements/controlled_suite_dependencies_py314.txt
        else
          python -m pip install --no-deps --force-reinstall -r devtools/requirements/controlled_suite_dependencies.txt
        fi

    - name: Check out the reviewed dependency SDK
      uses: actions/checkout@v4
      with:
        repository: uibcdf/molsyssuite
        ref: c866f0aa85f5fa0aec91973421eb23080daefdcc
        path: .molsyssuite
        persist-credentials: false

    - name: Install isolated dependency-check tools
      shell: bash -l {0}
      run: python -m pip install --target .molsyssuite-tools "PyYAML>=6" "Jinja2>=3,<4" "packaging>=24"

    - name: Check dependency routes and installed Git context
      shell: bash -l {0}
      run: python devtools/check_dependency_routes.py --context ci-${{ matrix.cfg.python-version }}

    - name: Info conda
      shell: bash -l {0}
      run: |
        micromamba activate test
        micromamba info
        micromamba list

    - uses: actions/download-artifact@v4
      with:
        name: native-wheel-${{ matrix.cfg.os }}
        path: native-wheelhouse

    - name: Install package
      shell: bash -l {0}
      run: |
        python -m pip install --no-deps native-wheelhouse/*.whl

    - name: Test import module
      shell: bash -l {0}
      run: |
        set -euo pipefail
        echo "::group::Importing module from home directory"
        trap 'echo "::endgroup::"' EXIT
        cd
        pwd
        python -c 'import elastnetmt; print("Version of the package: {}".format(elastnetmt.__version__))'

    - name: Verify interpreter and macOS architecture
      shell: bash -l {0}
      env:
        EXPECTED_PYTHON: ${{ matrix.cfg.python-version }}
      run: |
        set -euo pipefail
        python - <<'PYTHON'
        import os
        import platform
        import sys
        assert f"{sys.version_info.major}.{sys.version_info.minor}" == os.environ["EXPECTED_PYTHON"]
        if sys.platform == "darwin":
            assert platform.machine() == "arm64", platform.machine()
        print("Python", platform.python_version(), "architecture", platform.machine())
        PYTHON

    - name: Run tests
      shell: bash -l {0}
      run: |
        set -euo pipefail
        ENM_QUALIFICATION="$RUNNER_TEMP/elastnetmt-installed"
        mkdir -p "$ENM_QUALIFICATION"
        cp -R tests devtools devguide rust pyproject.toml .coveragerc *.md "$ENM_QUALIFICATION/"
        cd "$ENM_QUALIFICATION"
        unset PYTHONPATH
        python "$GITHUB_WORKSPACE/devtools/native_wheel.py" "$GITHUB_WORKSPACE"/native-wheelhouse/*.whl --inventory "$GITHUB_WORKSPACE/devtools/conda-build/native_resources.toml" --checkout "$GITHUB_WORKSPACE"
        python -m pytest --receptor=ci -v --cov-config=.coveragerc --cov=elastnetmt --cov-report=xml --junitxml=junit.xml --color=yes
        python "$GITHUB_WORKSPACE/devtools/native_wheel.py" "$GITHUB_WORKSPACE"/native-wheelhouse/*.whl --inventory "$GITHUB_WORKSPACE/devtools/conda-build/native_resources.toml" --checkout "$GITHUB_WORKSPACE"
        cp coverage.xml junit.xml "$GITHUB_WORKSPACE/"

    - name: Check coverage
      shell: bash -l {0}
      run: |
        cat ./coverage.xml

    - name: Upload coverage reports to Codecov
      if: matrix.cfg.os == 'ubuntu-latest' && matrix.cfg.python-version == '3.13'
      uses: codecov/codecov-action@v4
      with:
        verbose: true
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.cfg.os }}-py${{ matrix.cfg.python-version }}
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload test results to Codecov
      if: ${{ matrix.cfg.os == 'ubuntu-latest' && matrix.cfg.python-version == '3.13' && !cancelled() }}
      uses: codecov/test-results-action@v1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  test-macos:
    needs: [nightly-decision, native-wheel-macos]
    if: >-
      always() && inputs.probe_backlog != true
      && needs.native-wheel-macos.result == 'success'
      && (github.event_name != 'schedule' || github.event.schedule != '19 2 * * *'
      || needs.nightly-decision.result != 'success'
      || needs.nightly-decision.outputs.run_full == 'true')
    name: Test on ${{ matrix.cfg.os }}, Python ${{ matrix.cfg.python-version }}
    runs-on: ${{ matrix.cfg.os }}
    strategy:
      fail-fast: false  # do not cancel all in-progress jobs if any job variation fails
      matrix:
        cfg:
          - { os: macos-15,  python-version: "3.13", environment-file: "devtools/conda-envs/test_env_py313.yaml"}
          - { os: macos-15,  python-version: "3.14", environment-file: "devtools/conda-envs/test_env_py314.yaml"}
          - { os: macos-15,  python-version: "3.11", environment-file: "devtools/conda-envs/test_env.yaml"}
          - { os: macos-15,  python-version: "3.12", environment-file: "devtools/conda-envs/test_env.yaml"}

    steps: *installed-science-steps
