[package]
name = "elastnetmt-enm-prototype"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Experimental ENM matrix kernels; excluded from the ElastNetMT distribution."

[lib]
name = "_enm_prototype"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.29.0", features = ["abi3-py311"] }
numpy = "=0.29.0"

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[profile.release]
opt-level = 3
lto = true
