reason = "Pure Python tracked payload; version module, package roots and every committed runtime data file are required. No installed platform support is inferred."
version_file = "site-packages/elastnetmt/_version.py"
required_paths = [
  "site-packages/elastnetmt/_version.py",
  "site-packages/elastnetmt/__init__.py",
  "site-packages/elastnetmt/py.typed",
  "site-packages/molsysviewer_elastnetmt/__init__.py",
]

[installed_gate]
workflow = ".github/workflows/test_installed_conda_package.yaml"
platforms = ["linux-64", "osx-arm64"]
python_versions = ["3.11", "3.12", "3.13", "3.14"]
prepare_job = "installed / prepare"
job_template = "installed / {platform} · Python {python}"
required_steps = ["Install exact artifact", "Validate installed files", "Run installed tests"]

[installed_tests]
# Complete local suite selection; source scientific CI remains unchanged.
paths = ["tests"]
pytest_args = ["-v"]
