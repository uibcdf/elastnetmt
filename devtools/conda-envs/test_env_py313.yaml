# Scientific bootstrap derived from MolSysMT test_env.yaml at 3bcfaf4.
# Current fixed molecular/Viewer providers are reviewed in dependency_routes.toml.
# MolSysMT and suite-only Python packages are installed from pinned sources below.
channels:
- uibcdf
- conda-forge
- ambermd
dependencies:
- python >=3.11,<3.15
- pip
- setuptools >=68.0
- versioningit>=3.0
- h5py
- numpy
- pandas
- networkx
- tqdm
- matplotlib
- openmm
- pdbfixer
- ambertools
- openff-toolkit-base >=0.17.1
- openff-units >=0.3.0
- mdtraj
- mdanalysis
- rdkit
- parmed
- biopython
- ipywidgets
- py-mmcif >=1.1.1
- plotly
- anywidget
- aiohttp
- scikit-learn
- beartype
- packaging >=23
- pint
- pydantic
- pyyaml
- scipy
- traitlets >=5
- nglview
- pytest
- pytest-receptor=1.2.1
- numba
- pytest-cov
- codecov
- pytest-xdist
- ruff=0.16.5
