# Owner tooling only. pyproject.toml owns runtime/Python; dependency_routes.toml
# owns the test context's exact fixed-source replacements and public overlays.
setup:
  channels: &channels
    - uibcdf
    - conda-forge
  dependencies: &setup_tools
    - pip
    - setuptools >=61.0
    - versioningit ~=2.0
production:
  channels: *channels
  dependencies: *setup_tools
test:
  channels: *channels
  source_context: ci-3.11
  dependencies: &test_tools
    - *setup_tools
    - pytest
    - pytest-cov
    - pytest-xdist
    - codecov
docs:
  channels: *channels
  dependencies: &docs_tools
    - *setup_tools
    - jupyterlab
    - sphinx
    - pydata-sphinx-theme
    - sphinx-remove-toctrees
    - sphinxcontrib-bibtex
    - sphinx-copybutton
    - sphinx-design
    - sphinx-favicon
    - sphinx-tabs
    - myst-nb
    - seaborn
    - nbsphinx
development:
  channels: *channels
  dependencies:
    - *setup_tools
    - *test_tools
    - *docs_tools
    - mamba
conda-build:
  channels: *channels
  dependencies:
    - anaconda-client
    - conda-build
