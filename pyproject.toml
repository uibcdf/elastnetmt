[build-system]
requires = ["setuptools>=61.0", "versioningit~=2.0"]
build-backend = "setuptools.build_meta"

# Self-descriptive entries which should always be present
# https://packaging.python.org/en/latest/specifications/declaring-project-metadata/
[project]
name = "elastnetmt"
description = "A short description of the project"
dynamic = ["version"]
readme = "README.md"
authors = [
    { name = "UIBCDF Lab", email = "uibcdf@gmail.com" }
]
license = { text = "MIT" }
# See https://pypi.org/classifiers/
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.11.0,<3.14.0"
# Declare any run-time dependencies that should be installed with the package.
dependencies = [
    "numpy",
    "pyunitwizard",
    "matplotlib",
    "tqdm",
    "scikit-learn",
    "lindelint",
    "molsysmt",
    "smonitor",
    "argdigest",
    "depdigest",
]

# Update the urls once the hosting is set up.
[project.urls]
"Source" = "https://github.com/uibcdf/elastnetmt/"
"Documentation" = "https://uibcdf.org/elastnetmt"

[project.optional-dependencies]
test = [
  "pytest>=6.1.2",
  "pytest-runner"
]

[tool.setuptools]
# This subkey is a beta stage development and keys may change in the future, see https://setuptools.pypa.io/en/latest/userguide/pyproject_config.html for more details
#
# As of version 0.971, mypy does not support type checking of installed zipped
# packages (because it does not actually import the Python packages).
# We declare the package not-zip-safe so that our type hints are also available
# when checking client code that uses our (installed) package.
# Ref:
# https://mypy.readthedocs.io/en/stable/installed_packages.html?highlight=zip#using-installed-packages-with-mypy-pep-561
zip-safe = false
# Include private namespace packages used by installed imports.
# Restrict discovery to the two distribution roots to omit tests and data.
include-package-data = false
[tool.setuptools.packages.find]
namespaces = true
where = ["."]
include = ["elastnetmt*", "molsysviewer_elastnetmt*"]

# Ref https://setuptools.pypa.io/en/latest/userguide/datafiles.html#package-data
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
markers = [
    "smoke: quick tests for core functionality and imports",
    "physical: tests that verify physical correctness of the models",
    "integration: tests for cross-library interoperability (e.g. molsysmt)",
    "heavy: marks tests that require heavy processing (deselect with '-m \"not heavy\"')",
]

[tool.versioningit]
default-version = "0.1.0"

[tool.versioningit.format]
distance = "{base_version}"
dirty = "{base_version}"
distance-dirty = "{base_version}"

[tool.versioningit.vcs]
method = "git"
match = ["*"]
default-tag = "0.1.0"

[tool.versioningit.tag2version]
regex = '^(?P<version>(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$'
require-match = true

[tool.versioningit.write]
file = "elastnetmt/_version.py"

#[tool.flit.external-data]
#directory = "data"

[tool.ruff]
target-version = "py311"
extend-exclude = [
    "devguide",
    "docs",
    "sandbox",
    "elastnetmt/model/old_anm.py", # Unreferenced Python 2 legacy; tracked by uibcdf/elastnetmt#12.
    "ACKREDIT_GUIDE.md",
    "ARGDIGEST_GUIDE.md",
    "DEPDIGEST_GUIDE.md",
    "GH_RUN_RECEPTOR_GUIDE.md",
    "MOLSYSSUITE_GUIDE.md",
    "PYUNITWIZARD_GUIDE.md",
    "SMONITOR_GUIDE.md",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
